<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ЕГЭ Трекер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0e17;
      --surface: #111827;
      --card: #1a2234;
      --card-hover: #1f2a40;
      --border: #2a3548;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --math: #f59e0b;
      --math-glow: rgba(245, 158, 11, 0.25);
      --rus: #ef4444;
      --rus-glow: rgba(239, 68, 68, 0.25);
      --info: #3b82f6;
      --info-glow: rgba(59, 130, 246, 0.25);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.3);
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Manrope", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(245, 158, 11, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 80% 0%, rgba(59, 130, 246, 0.07), transparent),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(239, 68, 68, 0.05), transparent);
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.85rem;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }

    .header h1 {
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 30%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    /* Stats bar */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 700px) {
      .stats-bar { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      border-radius: var(--radius) var(--radius) 0 0;
    }

    .stat-card.total::before { background: linear-gradient(90deg, var(--math), var(--rus), var(--info)); }
    .stat-card.math-stat::before { background: var(--math); }
    .stat-card.rus-stat::before { background: var(--rus); }
    .stat-card.info-stat::before { background: var(--info); }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .stat-value {
      font-family: "JetBrains Mono", monospace;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .stat-sub {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }

    /* Subject sections */
    .subjects {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .subject {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      overflow: hidden;
    }

    .subject-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.25rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .tasks-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.85rem 1.25rem;
      gap: 0.75rem;
      cursor: pointer;
      user-select: none;
      background: rgba(0, 0, 0, 0.12);
      transition: background 0.15s;
    }

    .tasks-toggle:hover {
      background: var(--card-hover);
    }

    .tasks-toggle-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      min-width: 0;
    }

    .subject-expand-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--muted);
      font-size: 0.75rem;
      transition: transform 0.25s ease, background 0.15s, color 0.15s;
      pointer-events: none;
    }

    .tasks-collapse.expanded .subject-expand-btn {
      transform: rotate(180deg);
      color: var(--text);
    }

    .subject-known-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.25rem 0.55rem;
      border-radius: 999px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    .subject.math .subject-known-badge strong { color: var(--math); }
    .subject.rus .subject-known-badge strong { color: var(--rus); }
    .subject.info .subject-known-badge strong { color: var(--info); }

    .tasks-collapse {
      border-top: 1px solid var(--border);
    }

    .tasks-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s ease;
    }

    .tasks-collapse.expanded .tasks-body {
      grid-template-rows: 1fr;
    }

    .tasks-body-inner {
      overflow: hidden;
    }

    .tasks-section {
      padding: 0 1.25rem 1.25rem;
      background: rgba(0, 0, 0, 0.15);
    }

    .tasks-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .tasks-progress {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .tasks-progress strong {
      color: var(--accent);
    }

    .tasks-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      gap: 0.45rem;
      padding-top: 0.85rem;
    }

    .task-check {
      position: relative;
    }

    .task-check input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .task-check label {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      border-radius: var(--radius-sm);
      background: var(--card);
      border: 1px solid var(--border);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--muted);
    }

    .task-check label:hover {
      border-color: #3d4f6a;
      background: var(--card-hover);
      color: var(--text);
    }

    .task-check input:checked + label {
      color: #fff;
      border-color: transparent;
    }

    .subject.math .task-check input:checked + label {
      background: linear-gradient(135deg, #d97706, var(--math));
      box-shadow: 0 4px 12px var(--math-glow);
    }

    .subject.rus .task-check input:checked + label {
      background: linear-gradient(135deg, #dc2626, var(--rus));
      box-shadow: 0 4px 12px var(--rus-glow);
    }

    .subject.info .task-check input:checked + label {
      background: linear-gradient(135deg, #2563eb, var(--info));
      box-shadow: 0 4px 12px var(--info-glow);
    }

    .task-check input:checked + label::after {
      content: "✓";
      position: absolute;
      top: 3px;
      right: 5px;
      font-size: 0.55rem;
      opacity: 0.85;
    }

    .subject-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .subject-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      flex-shrink: 0;
    }

    .subject.math .subject-icon { background: var(--math-glow); }
    .subject.rus .subject-icon { background: var(--rus-glow); }
    .subject.info .subject-icon { background: var(--info-glow); }

    .subject-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .subject-total {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .subject.math .subject-total strong { color: var(--math); }
    .subject.rus .subject-total strong { color: var(--rus); }
    .subject.info .subject-total strong { color: var(--info); }

    .progress-wrap {
      flex: 1;
      min-width: 140px;
      max-width: 220px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .progress-track {
      height: 6px;
      background: var(--card);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }

    .subject.math .progress-fill { background: linear-gradient(90deg, #d97706, var(--math)); }
    .subject.rus .progress-fill { background: linear-gradient(90deg, #dc2626, var(--rus)); }
    .subject.info .progress-fill { background: linear-gradient(90deg, #2563eb, var(--info)); }

    /* Blocks grid */
    .blocks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border-top: 1px solid var(--border);
    }

    @media (max-width: 800px) {
      .blocks { grid-template-columns: 1fr; }
      .block { border-right: none !important; }
      .block:not(:last-child) { border-bottom: 1px solid var(--border); }
    }

    .block {
      padding: 1.1rem 1.15rem 1.25rem;
      border-right: 1px solid var(--border);
      transition: background 0.2s;
    }

    .block:last-child { border-right: none; }
    .block:hover { background: var(--card-hover); }
    .block.active { background: rgba(16, 185, 129, 0.06); }

    .block-name {
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.6rem;
    }

    .subject.math .block-name { color: var(--math); }
    .subject.rus .block-name { color: var(--rus); }
    .subject.info .block-name { color: var(--info); }

    .block-time {
      font-family: "JetBrains Mono", monospace;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 0.85rem;
      line-height: 1;
    }

    .block-timer {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.9rem;
      color: var(--accent);
      margin-bottom: 0.75rem;
      min-height: 1.2rem;
    }

    .block-timer.running {
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }

    .time-input-row {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }

    .time-field {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      flex: 1;
    }

    .time-field label {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .time-field input {
      width: 100%;
      padding: 0.45rem 0.4rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      outline: none;
      transition: border-color 0.15s;
      -moz-appearance: textfield;
    }

    .time-field input::-webkit-outer-spin-button,
    .time-field input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .time-field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }

    .time-sep {
      color: var(--muted);
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 1rem;
      flex-shrink: 0;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
    }

    .btn {
      padding: 0.45rem 0.7rem;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      font-weight: 600;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn:hover {
      background: var(--card-hover);
      border-color: #3d4f6a;
      transform: translateY(-1px);
    }

    .btn:active { transform: translateY(0); }

    .btn-add {
      flex: 1;
      min-width: 52px;
      text-align: center;
    }

    .btn-start {
      width: 100%;
      padding: 0.55rem;
      font-size: 0.82rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      margin-top: 0.25rem;
    }

    .subject.math .btn-start { background: var(--math-glow); color: var(--math); border: 1px solid rgba(245,158,11,0.35); }
    .subject.rus .btn-start { background: var(--rus-glow); color: #fca5a5; border: 1px solid rgba(239,68,68,0.35); }
    .subject.info .btn-start { background: var(--info-glow); color: #93c5fd; border: 1px solid rgba(59,130,246,0.35); }

    .subject.math .btn-start:hover { background: rgba(245,158,11,0.35); }
    .subject.rus .btn-start:hover { background: rgba(239,68,68,0.35); }
    .subject.info .btn-start:hover { background: rgba(59,130,246,0.35); }

    .btn-start.running {
      background: rgba(16, 185, 129, 0.15) !important;
      color: var(--accent) !important;
      border-color: rgba(16, 185, 129, 0.4) !important;
    }

    .btn-reset-block {
      width: 100%;
      margin-top: 0.35rem;
      padding: 0.3rem;
      font-size: 0.7rem;
      background: transparent;
      color: var(--muted);
      border: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .block:hover .btn-reset-block { opacity: 1; }
    .btn-reset-block:hover { color: #f87171; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 1.2rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
      z-index: 100;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <div class="header">
      <div class="header-badge">Профессиональный трекер</div>
      <h1>📚 ЕГЭ Трекер</h1>
      <p>Отслеживайте прогресс подготовки без регистрации</p>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat-card total">
        <div class="stat-label">Всего задач</div>
        <div class="stat-value" id="totalTasks">0</div>
        <div class="stat-sub">За все время</div>
      </div>
      <div class="stat-card math-stat">
        <div class="stat-label">Математика</div>
        <div class="stat-value" id="mathProgress">0%</div>
        <div class="stat-sub">Прогресс</div>
      </div>
      <div class="stat-card rus-stat">
        <div class="stat-label">Русский</div>
        <div class="stat-value" id="rusProgress">0%</div>
        <div class="stat-sub">Прогресс</div>
      </div>
      <div class="stat-card info-stat">
        <div class="stat-label">Информатика</div>
        <div class="stat-value" id="infoProgress">0%</div>
        <div class="stat-sub">Прогресс</div>
      </div>
    </div>

    <!-- Subjects -->
    <div class="subjects" id="subjectsContainer"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SUBJECTS = [
      { id: 'math', name: 'Математика', icon: '🔢', class: 'math', total: 50 },
      { id: 'rus', name: 'Русский язык', icon: '📝', class: 'rus', total: 50 },
      { id: 'info', name: 'Информатика', icon: '💻', class: 'info', total: 27 }
    ];

    let data = {
      math: { completed: new Array(50).fill(false) },
      rus: { completed: new Array(50).fill(false) },
      info: { completed: new Array(27).fill(false) }
    };

    // Load data from localStorage
    function loadData() {
      const saved = localStorage.getItem('egeData');
      if (saved) {
        data = JSON.parse(saved);
      }
      render();
    }

    // Save data to localStorage
    function saveData() {
      localStorage.setItem('egeData', JSON.stringify(data));
      updateStats();
    }

    function render() {
      const container = document.getElementById('subjectsContainer');
      container.innerHTML = SUBJECTS.map(subject => {
        const completed = data[subject.id].completed.filter(c => c).length;
        const progress = Math.round((completed / subject.total) * 100);
        
        return `
          <div class="subject ${subject.class}">
            <div class="subject-header">
              <div class="subject-title-wrap">
                <div class="subject-icon">${subject.icon}</div>
                <div>
                  <div class="subject-name">${subject.name}</div>
                  <div class="subject-total">Всего: <strong>${subject.total}</strong> заданий</div>
                </div>
              </div>
              <div class="progress-wrap">
                <div class="progress-label">
                  <span>Прогресс</span>
                  <span>${progress}%</span>
                </div>
                <div class="progress-track">
                  <div class="progress-fill" style="width: ${progress}%"></div>
                </div>
              </div>
              <div class="subject-known-badge">
                <strong>${completed}</strong>/<span>${subject.total}</span>
              </div>
            </div>

            <div class="tasks-collapse" id="collapse-${subject.id}">
              <div class="tasks-toggle" onclick="toggleTasks('${subject.id}')">
                <div class="tasks-toggle-left">
                  <div class="subject-expand-btn">▼</div>
                  <div>
                    <div class="tasks-title">ЗАДАНИЯ</div>
                    <div class="tasks-progress">Решено: <strong>${completed}</strong>/${subject.total}</div>
                  </div>
                </div>
              </div>
              <div class="tasks-body">
                <div class="tasks-body-inner">
                  <div class="tasks-section">
                    <div class="tasks-grid">
                      ${Array.from({ length: subject.total }, (_, i) => `
                        <div class="task-check">
                          <input type="checkbox" id="${subject.id}-task-${i}" 
                            ${data[subject.id].completed[i] ? 'checked' : ''}
                            onchange="toggleTask('${subject.id}', ${i})">
                          <label for="${subject.id}-task-${i}">${i + 1}</label>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
      
      updateStats();
    }

    function toggleTask(subjectId, taskIndex) {
      data[subjectId].completed[taskIndex] = !data[subjectId].completed[taskIndex];
      saveData();
      showToast('Прогресс сохранён');
    }

    function toggleTasks(subjectId) {
      const collapse = document.getElementById(`collapse-${subjectId}`);
      collapse.classList.toggle('expanded');
    }

    function updateStats() {
      let totalCompleted = 0;
      SUBJECTS.forEach(subject => {
        const completed = data[subject.id].completed.filter(c => c).length;
        const progress = Math.round((completed / subject.total) * 100);
        document.getElementById(`${subject.id}Progress`).textContent = progress + '%';
        totalCompleted += completed;
      });
      document.getElementById('totalTasks').textContent = totalCompleted;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Initialize
    loadData();
  </script>
</body>
</html>
